name: Migration-DEV

env:
  EU_API_Sandbox: https://rest.sandbox.eu.zuora.com

on:
  pull_request:
    branches: [ "Dev-test_2" ]

  workflow_dispatch:
    inputs:
      migrationName:
        type: string
        required: true
        default: 'Dev-test_2_Testing'
        description: 'Deployment name'

      clientId:
        type: string
        required: true
        default: '57b4d837-ad93-4dbb-bb92-712db4b77f5f'
        description: 'Target Tenant client id'

      secretKey:
        type: string
        required: true
        default: 'nnf/wxhjVgdU58Ss414GGU+gPRg/r0VaP5WbXwQMu'
        description: 'Target Tenant secret key'

      environment:
        type: choice
        required: true
        default: 'EU_API_Sandbox'
        description: 'Target Tenant environment'
        options:
          - EU_API_Sandbox

      tenantId:
        type: string
        required: true
        default: '2000253'
        description: 'Target Tenant Id'

      entityId:
        type: string
        required: true
        default: '8adc8f9963001486016318a3299f534a'
        description: 'Target Tenant Entity Id'

      filePath:
        type: string
        required: true
        default: 'Dev-test_2/data_query.json'
        description: 'Template File Path'

      workflowVersionAsInActive:
        type: boolean
        required: false
        default: false
        description: 'Deploy Workflow Version as InActive'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install curl
        run: sudo apt update && sudo apt install -y curl jq

      - name: Call OAuth API
        id: oauth
        run: |
          envi="${{ env[inputs.environment] }}"
          endpoint="/oauth/token"
          newEndPoint="$envi$endpoint"

          oauth_response=$(curl --location "$newEndPoint" \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=${{ inputs.clientId }}" \
            --data-urlencode "client_secret=${{ inputs.secretKey }}" \
            --data-urlencode 'grant_type=client_credentials')

          access_token=$(echo "$oauth_response" | jq -r '.access_token')
          scope=$(echo "$oauth_response" | jq -r '.scope')

          tenant=$(echo "$scope" | grep -o 'tenant\.[^ ]*' | cut -d'.' -f2)
          user=$(echo "$scope" | grep -o 'user\.[^ ]*' | cut -d'.' -f2)

          echo "token=$access_token" >> $GITHUB_OUTPUT
          echo "tenantId=$tenant" >> $GITHUB_OUTPUT
          echo "userId=$user" >> $GITHUB_OUTPUT

      - name: Initiate Deploy
        id: upload
        run: |
          oauth_token="${{ steps.oauth.outputs.token }}"
          envi="${{ env[inputs.environment] }}"
          migration_name_encoded=$(echo "${{ inputs.migrationName }}" | jq -sRr @uri)
          workflow_version_as_inactive="${{ inputs.workflowVersionAsInActive }}"

          endpoint="/deployment-manager/deployments/templates?name=$migration_name_encoded&description=$migration_name_encoded&comments=$migration_name_encoded&sendEmail=false&allWorkflowAsInactive=$workflow_version_as_inactive&emails="
          newEndPoint="$envi$endpoint"

          curl --location "$newEndPoint" \
            --header "zuora-tenant-id: ${{ inputs.tenantId }}" \
            --header "zuora-user-id: ${{ steps.oauth.outputs.userId }}" \
            --header "Zuora-Entity-Ids: ${{ inputs.entityId }}" \
            --header "Authorization: Bearer $oauth_token" \
            --form "template=@${{ inputs.filePath }}"

      - name: Deploy Triggered
        run: echo "Deployment of the golden template is triggered."
