name: Zuora-CICD-Pipeline

on:
  push:
    branches:
      - Deployments-SBX1

env:
  TARGET_URL: https://rest.test.eu.zuora.com

jobs:

  approval:
    runs-on: ubuntu-latest

    environment:
      name: Production-Approval

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show JSON files changed
        run: |
          git diff --name-only HEAD~1 HEAD | grep '\.json$' || true

      - name: Waiting for Approval
        run: echo "Waiting for deployment approval..."

  deploy:
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Dependencies
        run: sudo apt update && sudo apt install -y curl jq

      - name: Authenticate Target Tenant
        id: auth
        run: |
          response=$(curl --location "${{ env.TARGET_URL }}/oauth/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${{ secrets.TARGET_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.TARGET_SECRET }}" \
            --data-urlencode "grant_type=client_credentials")

          token=$(echo "$response" | jq -r '.access_token')

          if [ "$token" = "null" ] || [ -z "$token" ]; then
            echo "Authentication failed"
            echo "$response"
            exit 1
          fi

          echo "token=$token" >> $GITHUB_OUTPUT

      - name: Find Changed JSON Files
        id: files
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.json$' || true)

          if [ -z "$FILES" ]; then
            echo "No JSON deployment files found."
            exit 1
          fi

          echo "Files to deploy:"
          echo "$FILES"

          echo "FILES<<EOF" >> $GITHUB_ENV
          echo "$FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Deploy JSON Files
        run: |
          while IFS= read -r FILE
          do
            if [ ! -f "$FILE" ]; then
              echo "Skipping missing file: $FILE"
              continue
            fi

            deployment_name=$(basename "$FILE" .json)_$(date +%Y%m%d%H%M%S)

            echo "Deploying $FILE"

            curl --fail --location "${{ env.TARGET_URL }}/deployment-manager/deployments/templates" \
              --header "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
              --header "Accept: application/json" \
              --form "name=${deployment_name}" \
              --form "description=GitHub Deployment - ${deployment_name}" \
              --form "comments=Automated deployment from GitHub Actions" \
              --form "sendEmail=true" \
              --form "emails=vemulamanoj1920@gmail.com" \
              --form "template=@${FILE}"

          done <<< "$FILES"

      - name: Deployment Completed
        run: echo "All deployments completed successfully."
